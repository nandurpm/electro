name: Telegram ELECTRO Release Notification

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing published release tag"
        required: false
        default: "v4.0.0"
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/telegram-release-notify.yml

permissions:
  contents: read

jobs:
  notify:
    name: Send a styled Telegram release card
    runs-on: ubuntu-24.04
    steps:
      - name: Check out notification template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Announce the published APK with Telegram buttons
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v4.0.0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_release_notify.py
