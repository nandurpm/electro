name: Telegram ELECTRO Release Notification

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing published release tag"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/telegram-release-notify.yml

permissions:
  contents: read

jobs:
  notify:
    name: Send signed ELECTRO APK file
    runs-on: ubuntu-24.04
    steps:
      - name: Check out notification template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Upload latest published APK as Telegram file
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAG:-}" ]; then
            RELEASE_TAG="$(gh release view --json tagName -q .tagName)"
            export RELEASE_TAG
          fi
          python3 scripts/telegram_release_notify.py
