name: Android CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''
      - name: Install exact Android packages
        run: |
          set -euo pipefail
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Verify wrapper JAR
        run: echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Python validation
        run: |
          python3 -m venv "$RUNNER_TEMP/electro-python"
          source "$RUNNER_TEMP/electro-python/bin/activate"
          python -m pip install -r scripts/requirements-dev.txt
          python scripts/check_comments.py
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/validate_assets.py
          python scripts/validate_engineering.py
          python scripts/validate_library.py
          python scripts/check_contrast.py
      - name: Test debug and release variants
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=4 testDebugUnitTest testReleaseUnitTest lintDebug lintRelease assembleDebug assembleRelease | tee "$RUNNER_TEMP/electro-ci-build.log"
      - name: Generate current build evidence and source archive
        run: |
          "$RUNNER_TEMP/electro-python/bin/python" scripts/record_verification.py --apk app/build/outputs/apk/release/app-release-unsigned.apk --build-log "$RUNNER_TEMP/electro-ci-build.log" --variants debug release
          python3 scripts/package_project.py --archive "$RUNNER_TEMP/ELECTRO-source.zip"
          python3 scripts/package_project.py --check
          python3 scripts/check_verification.py --apk app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        continue-on-error: true
        with:
          name: ELECTRO-debug-and-reports
          path: |
            app/build/outputs/apk/debug/
            app/build/reports/
            app/build/test-results/
            app/build/design-previews/
            verification/
            ${{ runner.temp }}/ELECTRO-source.zip
          retention-days: 14
