name: Automatic version release

on:
  push:
    branches: [main]
    paths:
      - app/build.gradle.kts
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: automatic-version-release-main
  cancel-in-progress: false

jobs:
  tag-and-dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Tag changed app version and dispatch signed release
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          current_version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('app/build.gradle.kts').read_text()
          match = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit('versionName was not found')
          print(match.group(1))
          PY
          )
          current_code=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('app/build.gradle.kts').read_text()
          match = re.search(r'versionCode\s*=\s*(\d+)', text)
          if not match:
              raise SystemExit('versionCode was not found')
          print(match.group(1))
          PY
          )

          previous_ref="${BEFORE_SHA:-}"
          if [ -z "$previous_ref" ] || [ "$previous_ref" = 0000000000000000000000000000000000000000 ]; then previous_ref=HEAD^; fi
          previous_version=$(git show "$previous_ref":app/build.gradle.kts | python3 -c 'import re,sys; match=re.search(r"versionName\s*=\s*\"([^\"]+)\"", sys.stdin.read()); print(match.group(1) if match else "")')
          previous_code=$(git show "$previous_ref":app/build.gradle.kts | python3 -c 'import re,sys; match=re.search(r"versionCode\s*=\s*(\d+)", sys.stdin.read()); print(match.group(1) if match else "")')

          if [ "$EVENT_NAME" != workflow_dispatch ] && [ "$current_version" = "$previous_version" ] && [ "$current_code" = "$previous_code" ]; then
            echo "No version change detected; nothing to release."
            exit 0
          fi

          if ! printf '%s\n' "$current_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid versionName: $current_version" >&2
            exit 1
          fi
          if [ -z "$previous_code" ] || [ "$current_code" -le "$previous_code" ]; then
            echo "versionCode must increase: ${previous_code:-missing} -> $current_code" >&2
            exit 1
          fi

          tag="v$current_version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            tagged=$(git rev-parse "$tag^{commit}")
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "Tag $tag points to another commit; refusing to overwrite it." >&2
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" -m "ELECTRO $current_version" "$GITHUB_SHA"
            git push origin "$tag"
          fi

          gh api "repos/$GITHUB_REPOSITORY/dispatches" \
            --method POST \
            -f event_type=electro_release \
            -f "client_payload[release_tag]=$tag"

          echo "Created $tag and dispatched Android Release against the tag."
