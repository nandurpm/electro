name: ELECTRO Telegram Commands

on:
  workflow_dispatch:
    inputs:
      setup:
        description: "Verify and activate the private Telegram webhook"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/workflows/telegram-bot-commands.yml
      - scripts/bot-profile.jpg
      - scripts/telegram_webhook_setup.py
      - scripts/telegram_commands.py
      - scripts/test_telegram_commands.py

permissions:
  contents: read

concurrency:
  group: electro-telegram-webhook-setup
  cancel-in-progress: false

jobs:
  respond:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate Telegram command code
        if: github.event_name == 'push'
        run: python3 -m unittest discover -s scripts -p 'test_telegram_commands.py' -v
      - name: Verify and activate instant ELECTRO webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_webhook_setup.py
