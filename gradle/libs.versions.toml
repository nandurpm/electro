[versions]
agp = "8.7.3"
kotlin = "2.0.21"
compose = "2024.12.01"
[libraries]
androidx-core = { module = "androidx.core:core-ktx", version = "1.15.0" }
activity = { module = "androidx.activity:activity-compose", version = "1.9.3" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
material3 = { module = "androidx.compose.material3:material3" }
icons = { module = "androidx.compose.material:material-icons-core" }
navigation = { module = "androidx.navigation:navigation-compose", version = "2.10.2" }
lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.8.7" }
viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.8.7" }
datastore = { module = "androidx.datastore:datastore-preferences", version = "1.1.1" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.7.3" }
junit = { module = "junit:junit", version = "4.13.2" }
robolectric = { module = "org.robolectric:robolectric", version = "4.14.1" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
test-core = { module = "androidx.test:core-ktx", version = "1.6.1" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
